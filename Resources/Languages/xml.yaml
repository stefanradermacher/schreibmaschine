# XML. Das Format der Sprachdefinitionen beschreibt docs/sprachen.md im Quellcode der Schreibmaschine.
name: XML
extensions: [xml, plist, svg, xsd, xsl, xslt, rss, atom, xib, storyboard, csproj, xaml]
comment:
  block: ['<!--', '-->']
indent:
  width: 2
rules:
  - scope: comment
    begin: '<!--'
    end: '-->'
  - scope: code
    begin: '<!\[CDATA\['
    end: '\]\]>'
  - scope: keyword
    match: '<\?.*?\?>|<!DOCTYPE[^>]*>'
  - scope: tag
    match: '</?[A-Za-z_][\w:.-]*'
  - scope: tag
    match: '/?>'
  - scope: attribute
    match: '\b([A-Za-z_:][\w:.-]*)(?=\s*=)'
    group: 1
  - scope: string
    match: '=\s*("[^"]*"|''[^'']*'')'
    group: 1
  - scope: constant
    match: '&[A-Za-z0-9#]+;'
