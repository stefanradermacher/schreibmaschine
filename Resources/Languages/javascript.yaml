# JavaScript und TypeScript. Das Format der Sprachdefinitionen beschreibt docs/sprachen.md im Quellcode von Schreibmaschine.
name: JavaScript
extensions: [js, mjs, cjs, jsx, ts, tsx, mts, cts]
interpreters: [node, deno, bun]
comment:
  line: '//'
  block: ['/*', '*/']
indent:
  width: 2
rules:
  - scope: comment
    begin: '/\*'
    end: '\*/'
  - scope: comment
    match: '//.*$'
  - scope: string
    begin: '`'
    end: '`'
    escape: '\'
  - scope: string
    begin: '"'
    end: '"'
    escape: '\'
    multiline: false
  - scope: string
    begin: "'"
    end: "'"
    escape: '\'
    multiline: false
  - scope: attribute
    match: '@[A-Za-z_][A-Za-z0-9_]*'
  - scope: keyword
    words: [break, case, catch, class, const, continue, debugger, default, delete, do, else, export, extends,
            finally, for, from, function, if, import, in, instanceof, let, new, of, return, static, super, switch,
            this, throw, try, typeof, var, void, while, with, yield, async, await, get, set, interface, type, enum,
            implements, private, protected, public, readonly, declare, namespace, abstract, as, satisfies, keyof]
  - scope: constant
    words: [true, false, null, undefined, NaN, Infinity]
  - scope: number
    match: '\b(?:0[xX][0-9A-Fa-f_]+|0[bB][01_]+|\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?n?)\b'
  - scope: type
    match: '\b[A-Z][A-Za-z0-9_]*\b'
  - scope: function
    match: '\b([a-z_$][A-Za-z0-9_$]*)(?=\()'
    group: 1
