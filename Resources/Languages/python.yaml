# Python. Das Format der Sprachdefinitionen beschreibt docs/sprachen.md im Quellcode der Schreibmaschine.
name: Python
extensions: [py, pyw, pyi]
interpreters: [python, pypy]
comment:
  line: '#'
indent:
  width: 4
rules:
  - scope: string
    begin: '(?:\b[rRbBuUfF]{1,2})?"""'
    end: '"""'
    escape: '\'
  - scope: string
    begin: "(?:\\b[rRbBuUfF]{1,2})?'''"
    end: "'''"
    escape: '\'
  - scope: string
    begin: '(?:\b[rRbBuUfF]{1,2})?"'
    end: '"'
    escape: '\'
    multiline: false
  - scope: string
    begin: "(?:\\b[rRbBuUfF]{1,2})?'"
    end: "'"
    escape: '\'
    multiline: false
  - scope: comment
    match: '#.*$'
  - scope: attribute
    match: '^\s*@[A-Za-z_][A-Za-z0-9_.]*'
  - scope: keyword
    words: [and, as, assert, async, await, break, class, continue, def, del, elif, else, except, finally, for, from,
            global, if, import, in, is, lambda, nonlocal, not, or, pass, raise, return, try, while, with, yield,
            match, case]
  - scope: constant
    words: [True, False, None]
  - scope: variable
    words: [self, cls]
  - scope: number
    match: '\b(?:0[xX][0-9A-Fa-f_]+|0[bB][01_]+|0[oO][0-7_]+|\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?j?)\b'
  - scope: type
    match: '\b[A-Z][A-Za-z0-9_]*\b'
  - scope: function
    match: '\b([a-z_][A-Za-z0-9_]*)(?=\()'
    group: 1
