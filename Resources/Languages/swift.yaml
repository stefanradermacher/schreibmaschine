# Swift. Das Format der Sprachdefinitionen beschreibt docs/sprachen.md im Quellcode von Schreibmaschine.
name: Swift
extensions: [swift]
comment:
  line: '//'
  block: ['/*', '*/']
indent:
  width: 4
rules:
  - scope: comment
    begin: '/\*'
    end: '\*/'
  - scope: comment
    match: '//.*$'
  - scope: string
    begin: '#?"""'
    end: '"""#?'
    escape: '\'
  - scope: string
    begin: '#?"'
    end: '"#?'
    escape: '\'
    multiline: false
  - scope: attribute
    match: '[@#][A-Za-z_][A-Za-z0-9_]*'
  - scope: keyword
    words: [associatedtype, class, deinit, enum, extension, fileprivate, func, import, init, inout, internal, let,
            open, operator, private, precedencegroup, protocol, public, rethrows, static, struct, subscript,
            typealias, var, break, case, catch, continue, default, defer, do, else, fallthrough, for, guard, if, in,
            repeat, return, throw, switch, where, while, as, is, try, await, async, throws, some, any, self, Self,
            super, override, final, mutating, nonmutating, lazy, weak, unowned, convenience, required, optional,
            dynamic, indirect, actor, nonisolated, isolated, consuming, borrowing, macro, get, set, willSet, didSet]
  - scope: constant
    words: [true, false, nil]
  - scope: number
    match: '\b(?:0x[0-9A-Fa-f_]+|0b[01_]+|0o[0-7_]+|\d[\d_]*(?:\.\d[\d_]*)?(?:[eE][+-]?\d+)?)\b'
  - scope: type
    match: '\b[A-Z][A-Za-z0-9_]*\b'
  - scope: function
    match: '\b([a-z_][A-Za-z0-9_]*)(?=\()'
    group: 1
