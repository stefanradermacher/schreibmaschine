# SQL. Das Format der Sprachdefinitionen beschreibt docs/sprachen.md im Quellcode von Schreibmaschine.
name: SQL
extensions: [sql, ddl, dml]
comment:
  line: '--'
  block: ['/*', '*/']
indent:
  width: 4
ignoreCase: true
rules:
  - scope: comment
    begin: '/\*'
    end: '\*/'
  - scope: comment
    match: '--.*$'
  - scope: string
    begin: "'"
    end: "'"
  - scope: property
    match: '"[^"]*"|`[^`]*`'
  - scope: keyword
    words: [select, from, where, and, or, not, insert, into, values, update, set, delete, create, table, view,
            index, drop, alter, add, column, primary, key, foreign, references, join, inner, left, right, outer,
            full, cross, on, as, group, by, order, having, limit, offset, union, all, distinct, case, when, then,
            else, end, is, like, ilike, in, between, exists, begin, commit, rollback, transaction, default, unique,
            check, constraint, if, replace, returning, with, recursive, asc, desc, cascade, trigger, procedure,
            function, returns, declare, grant, revoke, database, schema, use, show, describe, explain, truncate,
            using, natural, over, partition, window, lateral, collate]
  - scope: type
    words: [int, integer, bigint, smallint, tinyint, decimal, numeric, float, double, real, char, varchar, text,
            blob, date, time, timestamp, datetime, interval, boolean, bool, serial, bigserial, uuid, json, jsonb]
  - scope: constant
    words: [true, false, null]
  - scope: number
    match: '\b\d+(?:\.\d+)?\b'
  - scope: function
    match: '\b([A-Za-z_][A-Za-z0-9_]*)(?=\()'
    group: 1
